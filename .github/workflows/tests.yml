name: Testy

on:
  push:
    branches: [main]
    paths: ["scraper/**", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["scraper/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements-dev.txt
      # testy nevolají Claude API (falešný klient), klíč není potřeba
      - run: pytest scraper/tests -q
